function optCls(i,idOrIdx,isSel){ // tô màu phương án chọn một / chọn nhiều
  const q=QUIZ_DATA[i],s=S[i],right=q.answer.includes(idOrIdx);
  if(s.status==='ok1'||s.status==='ok2')return isSel?'ok':'';
  if(s.status==='fail'){if(right)return 'ok';return isSel?'bad':'';}
  if(s.marks[idOrIdx]==='bad')return 'bad';
  return isSel?'sel':'';
}
function audioBar(i){
  const q=QUIZ_DATA[i],s=S[i],src=q.assets.audio[0];if(!src)return '';
  const lim=q.listen_limit, rest=lim?Math.max(0,lim-s.plays):null, dis=lim&&rest===0&&!locked(i);
  return `<div class="audio"><button class="play" data-act="play" ${dis?'disabled':''} aria-label="Phát âm thanh">🔊 ${q.options&&q.options[0]&&q.options[0].clip?'Nghe cả 4 từ':'Nghe'}</button>${lim?`<span class="left" aria-live="polite">${locked(i)?'Đã khoá câu':'Còn '+rest+' lần nghe'}</span>`:''}</div>`;
}
function bankHTML(i,items,usedFn,extraCls){
  const lk=locked(i);let h=`<div class="bank ${extraCls||''}" data-drop="bank">`;let any=false;
  items.forEach((c,ci)=>{if(usedFn(ci))return;any=true;
    h+=`<button class="card ${extraCls==='letters'?'letter':''} ${picked===ci?'picked':''} ${S[i].marks['c'+ci]?'wrong':''}" data-card="${ci}" ${lk?'disabled':''} aria-pressed="${picked===ci}">${cardHTML(c)}</button>`;});
  if(!any)h+=`<span class="empty">Đã dùng hết thẻ.</span>`;
  return h+'</div>';
}
function body(i){
  const q=QUIZ_DATA[i],s=S[i],v=s.v,lk=locked(i),fin=s.status==='fail',res=(fin||s.status)?cellResults(q,v):null,okAll=s.status==='ok1'||s.status==='ok2';
  const slotCls=k=>{if(okAll)return 'ok';if(fin&&res)return res[k]?'ok':'wrong';return s.marks['s'+k]?'wrong':'';};
  let h='';
  /* dạng không tự dựng ảnh (điền số, select nhiều dòng, kéo thả nhiều dòng) → vẽ ảnh ở đầu */
  const selfImg=!((q.type==='dropdown'&&q.lines)||(q.type==='drag-fill'&&q.sentences&&!q.images_per_sentence&&q.assets.images.length!==1));
  if((!selfImg||q.assets.images.length>1)&&q.assets.images.length)
    h+=`<div class="imgrow">`+q.assets.images.map(f=>media(f,'scene',ALT[f]||'Hình minh hoạ')).join('')+`</div>`;
  switch(q.type){
  case 'image-mcq':{
    const opts=`<div class="opts ${q.clues?'g2':'g4'}">`+q.options.map(o=>`<button class="opt pic ${optCls(i,o.id,v===o.id)}" data-act="pick" data-id="${o.id}" ${lk?'disabled':''} aria-label="Hình ${o.id}"><span class="key">${o.id}</span>${media(o.img,'opt','Hình '+o.id,o.id)}</button>`).join('')+'</div>';
    if(q.clues) h+=`<div class="row-flex"><div class="clues">${q.clues.map((c,k)=>`<div class="clue"><b>${k+1}.</b>${esc(c)}</div>`).join('')}</div><div style="flex:1 1 0">${opts}</div></div>`;
    else h+=`<div class="stem">${esc(q.stem)}</div>`+opts;
    break;}
  case 'mcq':{const img=sceneImg(q);
    const w=`<div class="stem">${esc(q.stem).replace(/_{2,}/,'<span class="gap"></span>')}</div>`+gonOpts(q,img,'')+q.options.map(o=>`<button class="opt ${optCls(i,o.id,v===o.id)}" data-act="pick" data-id="${o.id}" ${lk?'disabled':''}><span class="key">${o.id}</span><span>${esc(o.text)}</span></button>`).join('')+'</div>';
    h+=img?(WIDE.includes(img)?media(img,'scene wide',ALT[img])+w:`<div class="split">${media(img,'side',ALT[img])}<div class="work">${w}</div></div>`):w; break;}
  case 'audio-mcq':{const img=sceneImg(q);
    h+=audioBar(i);
    if(q.options[0].word){
      if(img) h+=media(img,'scene',ALT[img]);
      h+=`<div class="opts g4">`+q.options.map(o=>`<div style="position:relative"><button class="opt word ${optCls(i,o.id,v===o.id)}" data-act="pick" data-id="${o.id}" ${lk?'disabled':''}><span class="key">${o.id}</span><span class="w">${q.no===7?ul(o.word,o.underline,'hl'):ul(o.word,o.underline)}</span></button>${o.clip?`<button class="mini" data-act="clip" data-id="${o.id}" aria-label="Nghe riêng từ ${esc(o.word)}">🔊</button>`:''}</div>`).join('')+'</div>';
    } else {
      if(img) h+=media(img,'scene',ALT[img]);
      h+=`<div class="opts long">`+q.options.map(o=>`<button class="opt ${optCls(i,o.id,v===o.id)}" data-act="pick" data-id="${o.id}" ${lk?'disabled':''}><span class="key">${o.id}</span><span>${esc(o.text)}</span></button>`).join('')+'</div>';
    } break;}
  case 'audio-click-word':{const img=sceneImg(q);
    h+=audioBar(i)+(img?media(img,'scene',ALT[img]):'');
    let sent=esc(q.sentence);
    q.clickable.forEach(c=>{sent=sent.replace(new RegExp('\\b'+c.word+'\\b'),`@@${c.id}@@`);});
    q.clickable.forEach(c=>{sent=sent.replace(`@@${c.id}@@`,`<button class="cw ${optCls(i,c.id,v===c.id)}" data-act="pick" data-id="${c.id}" ${lk?'disabled':''}>${ul(c.word,c.underline)}</button>`);});
    h+=`<div class="sent">${sent}</div>`; if(!lk)h+=`<p class="note">Bấm trực tiếp vào từ trong câu.</p>`; break;}
  case 'multi-select':{const img=sceneImg(q);
    const w=`<div class="stem">${esc(q.stem).replace(/_{2,}/,'<span class="gap"></span>')}</div><p class="note" style="margin:-8px 0 12px">Chọn tất cả các đáp án đúng</p>`+gonOpts(q,img,'g2')+
      q.options.map(o=>{const sel=v.includes(o.id);return `<button class="opt ${optCls(i,o.id,sel)}" data-act="toggle" data-id="${o.id}" ${lk?'disabled':''} role="checkbox" aria-checked="${sel}"><span class="key">${sel?'✓':o.id}</span><span>${esc(o.text)}</span></button>`;}).join('')+'</div>';
    h+=img?(WIDE.includes(img)?media(img,'scene wide',ALT[img])+w:`<div class="split">${media(img,'side',ALT[img])}<div class="work">${w}</div></div>`):w; break;}
  case 'dropdown':{const img=sceneImg(q);
    const sel=k=>{const val=(k==null?v:v[k]), kk=(k==null?'':k);
      const cls=okAll?'ok':(fin?((k==null||!res)?'bad':(res[k]?'ok':'bad')):(s.marks['dd'+kk]?'bad':''));
      const pick=(val==null&&!lk)?' pick':'';
      return `<button type="button" class="dd ${cls}${pick}" data-act="dd" data-k="${kk}" ${lk?'disabled':''} aria-haspopup="listbox" aria-expanded="false" aria-label="Chọn đáp án${k==null?'':' dòng '+(k+1)}${val==null?'':': '+escA(ddTextById(q,val))}">${val==null?'— chọn —':esc(ddTextById(q,val))}</button>`;};
    if(q.lines){ // nhiều ô select, mỗi dòng một ô
      h+=(q.stem?`<div class="stem">${esc(q.stem)}</div>`:'')+`<div class="stem">`+q.lines.map((ln,k)=>{const p=ln.split(/_{2,}/);
        return `<span class="ddline">${esc(p[0])}${sel(k)}${esc(p[1]||'')}</span>`;}).join('')+`</div>`;
    } else {
      const parts=q.stem.split(/_{2,}/);
      h+=(img?media(img,'scene',ALT[img]):'')+`<div class="ddsolo">${sel(null)}</div>`;
    } break;}
  case 'number-fill':{
    const inp=k=>`<input class="numin${String(q.answer[k]||'').length>=9?' dai':''} ${okAll?'ok':fin?(res[k]?'ok':'bad'):(s.marks['b'+k]?'bad':'')}" data-box="${k}" type="text" inputmode="${q.inputmode||'numeric'}" autocomplete="off" value="${escA(v[k]||'')}" ${lk?'disabled':''} aria-label="Ô trống ${k+1}">`;
    {const img=sceneImg(q); if(img) h+=media(img,'scene',ALT[img]);}
    h+=`<div class="stem">${esc(q.prompt)}</div>`;
    if(q.template){let n=0; const t=q.template.replace(/_{3,}/g,()=>'\u0001'+(n++)+'\u0002');
      const html=esc(t).replace(/\u0001(\d+)\u0002/g,(_,k)=>inp(+k))
        .replace(/⟪(\d+)⟫/g,(_,k)=>`<span class="boxref ${v[+k]?'':'empty'}" data-ref="${k}">${v[+k]?escRaw(v[+k]):'ô '+(+k+1)}</span>`);
      h+=`<div class="fillwrap">`+html.split('\n').map(l=>`<div class="fillline">${l}</div>`).join('')+`</div>`;}
    else h+=`<div class="boxrow">`+v.map((_,k)=>`<label class="boxlab">${q.boxes>1?'<span>Ô '+(k+1)+'</span>':''}${inp(k)}</label>`).join('')+`</div>`;
    if(!lk&&NUM_NOTE)h+=`<p class="note">${NUM_NOTE}</p>`;
    break;}
  case 'truefalse-grid':{const img=sceneImg(q);
    h+=(img?media(img,'scene',ALT[img]):'')+(q.stem?`<div class="stem">${esc(q.stem)}</div>`:'')+`<table class="tf"><tr><th>Câu</th><th>✓ Đúng</th><th>✗ Sai</th></tr>`+q.rows.map((r,k)=>{
      const b=(val,sym)=>{let c=v[k]===val?'sel':'';if(okAll&&v[k]===val)c='ok';else if(fin){if(r.answer===val)c='ok';else if(v[k]===val)c='bad';}
        return `<button class="tfb ${c}" data-act="tf" data-k="${k}" data-v="${val}" ${lk?'disabled':''} aria-label="${sym==='✓'?'Đúng':'Sai'}" aria-pressed="${v[k]===val}">${sym}</button>`;};
      return `<tr class="${s.marks['r'+k]?'wrong':''}"><td>${esc(r.text)}</td><td class="c">${b(true,'✓')}</td><td class="c">${b(false,'✗')}</td></tr>`;}).join('')+'</table>'; break;}
  case 'letter-build':{const img=sceneImg(q);
    const w=`<div class="stem">${esc(q.stem.replace(q.given_prefix+'______','@@')).replace('@@','<span class="gap" style="min-width:60px"></span>')}</div>`+
      `<div class="tray locked-none" style="gap:8px"><span class="slot letter given">${q.given_prefix}</span>`+v.map((li,k)=>`<button class="slot letter ${li!=null?'filled':''} ${slotCls(k)}" data-drop="s${k}" ${lk?'disabled':''} aria-label="Ô chữ ${k+2}">${li!=null?q.letters[li]:''}</button>`).join('')+`</div>`+
      bankHTML(i,q.letters,ci=>v.includes(ci),'letters')+(lk?'':`<p class="note">Bấm chữ cái để đưa vào ô trống tiếp theo; bấm vào ô chữ để trả chữ về băng.</p>`);
    h+=img?`<div class="split rev">${media(img,'side',ALT[img])}<div class="work">${w}</div></div>`:w; break;}
  case 'drag-fill':{
    const used=ci=>Object.values(v).includes(ci);
    const slot=(k,day)=>`<button class="slot${day?' day':''} ${v[k]!=null?'filled':''} ${v[k]!=null&&!lk?'movable':''} ${slotCls(k)}" data-drop="s${k}" ${v[k]!=null&&!lk?'data-from="'+v[k]+'"':''} ${lk?'disabled':''} aria-label="Chỗ trống ${k+1}">${v[k]!=null?esc(q.cards[v[k]]):'&nbsp;'}</button>`;
    if(q.stem) h+=`<div class="stem">${esc(q.stem)}</div>`;
    if(q.sentences){
      const img1=(!q.images_per_sentence&&q.assets.images.length===1)?q.assets.images[0]:null;
      const linesH=`<div class="lines">`+q.sentences.map((sn,k)=>{const p=blanks(sn);const im=q.images_per_sentence?media(q.images_per_sentence[k],'line',ALT[q.images_per_sentence[k]]):'';
        const day=!p[0].trim()&&!(p[1]||'').trim();
        return `<div class="line">${im}<span class="txt${day?' day':''}">${k+1}. ${esc(p[0])}${slot(k,day)}${esc(p[1]||'')}</span></div>`;}).join('')+`</div>`;
      h+=(img1?`<div class="dfsplit"><div>${media(img1,'dfimg',ALT[img1])}<p class="note dfzoom">Bấm vào hình để xem to hơn.</p></div>${linesH}</div>`:linesH+`<div style="height:16px"></div>`)+bankHTML(i,q.cards,used);
    } else {const img=sceneImg(q);let k=0;
      const p=blanks(q.sentence);
      h+=(img?media(img,'scene',ALT[img]):'')+`<div class="stem">`+p.map((seg,j)=>esc(seg)+(j<p.length-1?slot(k++):'')).join('')+`</div>`+bankHTML(i,q.cards,used);
    }
    if(!lk)h+=`<p class="note">Kéo thẻ thả vào chỗ trống. Muốn đổi, kéo thẻ sang chỗ trống khác hoặc kéo ra ngoài để trả thẻ về.</p>`; break;}
  case 'drag-categorise':{const img=sceneImg(q);
    h+=(img?media(img,'scene',ALT[img]):'')+bankHTML(i,q.cards,ci=>v[ci]!=null);
    h+=`<div class="boxes">`+q.targets.map((t,ti)=>`<div class="box c${ti%4}" data-drop="t${ti}" role="button" tabindex="${lk?-1:0}" aria-label="Ô ${escA(t)}"><h5>${esc(t)}</h5><div class="in">`+
      q.cards.map((c,ci)=>v[ci]===ti?`<button class="card ${okAll?'ok':fin?(res[ci]?'ok':'wrong'):''}" data-placed="${ci}" ${lk?'disabled':''}>${cardHTML(c)}</button>`:'').join('')+`</div></div>`).join('')+'</div>';
    if(fin) h+=''; if(!lk)h+=`<p class="note">Kéo thẻ vào ô, hoặc bấm chọn thẻ rồi bấm vào ô. Bấm thẻ đã thả để lấy ra.</p>`; break;}
  case 'sentence-order':{const img=sceneImg(q);
    h+=(img?media(img,'scene',ALT[img]):'')+`<div class="tray">`+v.map((ci,k)=>`<button class="slot so ${ci!=null?'filled':''} ${slotCls(k)}" data-drop="s${k}" ${lk?'disabled':''} aria-label="Vị trí ${k+1}"><span class="slno">${k+1}</span>${ci!=null?esc(q.cards[ci]):''}</button>`).join('')+`</div>`+bankHTML(i,q.cards,ci=>v.includes(ci));
    if(!lk)h+=`<p class="note">Bấm thẻ để đưa vào vị trí trống tiếp theo, hoặc kéo thẻ vào đúng vị trí. Bấm vào thẻ trên khay để bỏ ra.</p>`; break;}
  case 'rank-order':{const img=sceneImg(q);
    h+=(img?media(img,'scene',ALT[img]):'')+`<div class="row-flex"><div class="ladder" style="flex:1 1 0"><div class="ladder-lbl">▲ Nhiều nhất</div>`+v.map((ci,k)=>`<div class="step"><span class="n">${k+1}</span><button class="slot ${ci!=null?'filled':''} ${slotCls(k)}" data-drop="s${k}" ${lk?'disabled':''} aria-label="Bậc ${k+1}">${ci!=null?esc(q.cards[ci]):''}</button></div>`).join('')+
      `<div class="ladder-lbl">▼ Ít nhất</div></div><div class="side-bank">`+bankHTML(i,q.cards,ci=>v.includes(ci)).replace('class="bank','class="bank" style="border:none;background:none;flex-direction:column;padding:0;margin:0" data-x="')+`</div></div>`;
    if(!lk)h+=`<p class="note">Kéo thẻ vào từng bậc thang, hoặc bấm thẻ để đưa vào bậc trống tiếp theo.</p>`; break;}
  case 'error-fix-grid':{const img=sceneImg(q);const used=Object.values(v).map(x=>x.c);
    h+=(img?media(img,'scene',ALT[img]):'')+`<div class="row-flex"><div class="slips">`+q.rows.map((r,k)=>{const x=v[k],card=x?q.cards[x.c]:null,nm=card==='No mistake';
      const rc=okAll?'ok':fin?(res[k]?'ok':'wrong'):(s.marks['r'+k]?'wrong':'');
      let row=`<div class="slip ${rc}" data-drop="r${k}"><span class="n">${k+1}.</span>`;
      row+=rowWords(r).map((w,wi)=>(x&&!nm&&x.w===wi)?`<span class="w strike">${esc(w.raw)}</span><button class="mark ${rc==='ok'?'ok':rc==='wrong'&&lk?'bad':''}" data-unfix="${k}" ${lk?'disabled':''}>${esc(card)}</button>`
        :`<button class="w" data-drop="w${k}_${wi}" ${lk?'disabled':''}>${esc(w.raw)}</button>`).join(' ');
      if(nm)row+=` <button class="mark ${rc==='ok'?'ok':rc==='wrong'&&lk?'bad':''}" data-unfix="${k}" ${lk?'disabled':''}>No mistake</button>`;
      return row+'</div>';}).join('')+`</div><div class="side-bank">`+bankHTML(i,q.cards,ci=>used.includes(ci)).replace('class="bank','class="bank" style="border:none;background:none;flex-direction:column;padding:0;margin:0" data-x="')+`</div></div>`;
    if(!lk)h+=`<p class="note">Chọn một thẻ rồi bấm (hoặc thả) lên từ sai. Với "No mistake", thả vào bất kỳ chỗ nào của câu.</p>`; break;}
  }
  return h;
}
const RW={};
function rowWords(r){if(RW[r.text])return RW[r.text];return RW[r.text]=r.text.split(' ').map(w=>({raw:w,clean:w.replace(/[.,?!]+$/,'')}));}

/* ===== bảng câu hỏi: dựng một lần, sau đó chỉ cập nhật ô đổi trạng thái ===== */
const navEl=document.getElementById('qnav');
const GROUPS=(()=>{const g=[];QUIZ_DATA.forEach((q,i)=>{let last=g[g.length-1];
  if(!last||last.part!==q.part){last={part:q.part,idx:[]};g.push(last);} last.idx.push(i);});return g;})();
function buildNav(){
  navEl.innerHTML=`<button class="navtog" id="navtog" aria-expanded="false" aria-controls="navbody"><span id="navtoglab">Danh sách câu</span><span class="x" aria-hidden="true">▾</span></button><div class="navbody" id="navbody">`+GROUPS.map((g,gi)=>`<div class="grp g-${g.part}" data-g="${gi}">
    <div class="grp-h"><span>Phần ${gi+1}: ${PART_NAME[g.part]}</span><span class="sc" data-sc="${gi}">0/${g.idx.length}</span></div>
    <div class="cells">`+g.idx.map(i=>`<button class="cell" data-go="${i}" disabled aria-label="Câu ${i+1}">${i+1}</button>`).join('')+`</div></div>`).join('')+`</div>`;
  const tg=document.getElementById('navtog');
  tg.onclick=()=>{const op=navEl.classList.toggle('open'); tg.setAttribute('aria-expanded',String(op));};
}
function updateNav(){
  if(!navEl.firstChild)buildNav();
  QUIZ_DATA.forEach((q,i)=>{const b=navEl.querySelector('[data-go="'+i+'"]');if(!b)return;
    const st=S[i]?S[i].status:null, open=(i===cur||st!==null);
    let cls='cell'; if(st==='ok1'||st==='ok2')cls+=' ok'; else if(st==='fail')cls+=' bad';
    if(i===cur)cls+=' now'; if(i===view&&i!==cur)cls+=' view';
    b.className=cls; b.disabled=!open; b.setAttribute('aria-disabled',String(!open));
    b.setAttribute('aria-label','Câu '+(i+1)+(i===cur?' – đang làm':st==='fail'?' – đã làm, chưa đúng':st?' – đã làm đúng':' – chưa mở'));});
  const lab=document.getElementById('navtoglab');
  if(lab)lab.textContent='Danh sách câu · đang làm câu '+(cur+1)+'/'+N;
  GROUPS.forEach((g,gi)=>{const ok=g.idx.filter(i=>S[i]&&(S[i].status==='ok1'||S[i].status==='ok2')).length;
    const sc=navEl.querySelector('[data-sc="'+gi+'"]'); if(sc)sc.textContent=ok+'/'+g.idx.length;
    const grp=navEl.querySelector('[data-g="'+gi+'"]'); if(grp)grp.classList.toggle('on',g.idx.includes(cur));});
}
function renderQuestion(){
  if(typeof closeDD==='function')closeDD();
  const i=view, ro=(i!==cur), q=QUIZ_DATA[i],s=S[i];
  document.body.className='part-'+q.part;
  let fb='';
  if(s.msg) fb=`<div class="fb info">${s.msg}</div>`;
  else if(s.status==='ok1'||s.status==='ok2') fb=`<div class="fb ok">${esc(q.feedback_ok)}</div>`+(q.feedback_full?`<div class="explain">${esc(q.feedback_full)}</div>`:'');
  else if(s.status==='fail') fb=`<div class="fb bad">Chưa đúng rồi. Câu này đã được khoá.</div><div class="explain"><div class="anskey">Đáp án đúng: ${esc(answerText(q))}</div>${esc(q.feedback_full)}</div>`;
  else if(s.att===1) fb=`<div class="fb bad">Chưa đúng. Em còn một lần thử nữa!</div>`;
  const hint=(s.att===1&&s.status===null)?`<div class="hint"><b>Gợi ý:</b> ${esc(q.hint)}</div>`:'';
  const btn=ro?`<button class="btn btn-next" data-act="back">← Quay lại câu ${cur+1}</button>`
    :(s.status===null?`<button class="btn btn-main" data-act="check">Kiểm tra</button>`:`<button class="btn btn-next" data-act="next">${cur<N-1?'Câu tiếp theo →':'Xem kết quả →'}</button>`);
  const bar=ro?`<div class="review-bar">Em đang xem lại câu ${i+1} (đã làm xong). Câu này không chấm lại.</div>`:'';
  const inner=`${bar}${body(i)}<div class="actions">${btn}</div>${fb}${hint}`;
  const qb=app.querySelector('.qcard[data-q="'+i+'"] .qbody');
  if(qb){ // cùng câu: chỉ cập nhật phần thân, không dựng lại thẻ câu hỏi → không chớp, không chạy lại hiệu ứng
    const keep={}; qb.querySelectorAll('img[src]').forEach(im=>{keep[im.getAttribute('src')]=im;});
    const y=window.scrollY; qb.innerHTML=inner;
    qb.querySelectorAll('img[src]').forEach(im=>{const o=keep[im.getAttribute('src')]; if(o&&o!==im){im.replaceWith(o); delete keep[im.getAttribute('src')];}});
    if(window.scrollY!==y) window.scrollTo(0,y);
  } else {
    app.innerHTML=`<section class="qcard" data-q="${i}"><div class="qhead qh5"><span class="tag">${esc(String(q.instruction||'').replace(/\.\s*$/,''))}</span><div class="q-title"><span class="qno">Câu ${q.no}:</span> ${deBai(q)}</div></div>
    <div class="qbody">${inner}</div></section>`;
  }
  document.getElementById('countPill').textContent='Câu '+(cur+1)+' / '+N;
  document.getElementById('progBar').style.width=((cur+(S[cur].status?1:0))/N*100)+'%';
  updateNav();
  const nb=app.querySelector('[data-act=next]'); if(nb&&justChecked) nb.focus({preventScroll:true});
  app.classList.toggle('just-checked',justChecked); justChecked=false;
}

/* ================= TƯƠNG TÁC ================= */
function change(){const s=S[cur];s.msg='';}
function clearMark(k){delete S[cur].marks[k];}
function place(ci,target){ // target: 'bank' | sK | tK | rK | wK_W
  const q=QUIZ_DATA[cur],s=S[cur],v=s.v; if(locked(cur))return; change(); clearMark('c'+ci);
  const t=target[0], k=target==='bank'?null:target.slice(1);
  switch(q.type){
    case 'drag-fill': for(const x in v) if(v[x]===ci) delete v[x]; if(t==='s'){v[+k]=ci;clearMark('s'+k);} break;
    case 'drag-categorise': if(t==='t') v[ci]=+k; else delete v[ci]; break;
    case 'letter-build':case 'sentence-order':case 'rank-order':{const j=v.indexOf(ci); if(j>=0)v[j]=null;
      if(t==='s'){v[+k]=ci;clearMark('s'+k);} break;}
    case 'error-fix-grid':{for(const x in v) if(v[x].c===ci) delete v[x];
      if(t==='r'){ if(q.cards[ci]==='No mistake'){v[+k]={c:ci,w:null};clearMark('r'+k);} }
      else if(t==='w'){const [r,w]=k.split('_').map(Number); v[r]={c:ci,w:q.cards[ci]==='No mistake'?null:w}; clearMark('r'+r);} break;}
  }
  picked=null; renderQuestion();
}
function firstEmpty(v){return v.indexOf(null);}
navEl.addEventListener('click',e=>{
  const b=e.target.closest('[data-go]'); if(!b||b.disabled||phase!=='quiz')return;
  const i=+b.dataset.go; if(i!==cur&&S[i].status===null)return; stopAudio(); view=i;
  if(window.matchMedia('(max-width:1040px)').matches)navEl.classList.remove('open');
  renderQuestion(); ganKhung(true);
});
app.addEventListener('click',e=>{
  if(phase!=='quiz')return;
  const back=e.target.closest('[data-act="back"]'); if(back){stopAudio(); view=cur; renderQuestion(); ganKhung(true); return;}
  if(view!==cur)return;
  const q=QUIZ_DATA[cur],s=S[cur],v=s.v;
  const a=e.target.closest('[data-act]');
  if(a){const act=a.dataset.act,id=a.dataset.id;
    if(act==='play'){playMain();return;} if(act==='clip'){e.stopPropagation();const o=q.options.find(x=>x.id===id);playFile(o.clip,o.word,a);return;}
    if(act==='check'){check();return;} if(act==='next'){next();return;}
    if(locked(cur))return;
    if(act==='dd'){openDD(a); return;}
    if(act==='pick'){change(); s.v=id; s.marks={}; renderQuestion(); return;}
    if(act==='toggle'){change(); const k=v.indexOf(id); k<0?v.push(id):v.splice(k,1); clearMark(id); renderQuestion(); return;}
    if(act==='tf'){change(); v[+a.dataset.k]=a.dataset.v==='true'; clearMark('r'+a.dataset.k); renderQuestion(); return;}
  }
  if(locked(cur))return;
  const unfix=e.target.closest('[data-unfix]'); if(unfix){e.stopPropagation(); if(picked!=null){place(picked,'r'+unfix.dataset.unfix);return;} delete v[+unfix.dataset.unfix]; change(); renderQuestion(); return;}
  const placed=e.target.closest('[data-placed]'); if(placed){e.stopPropagation(); if(picked!=null){place(picked,placed.closest('[data-drop]').dataset.drop);} else place(+placed.dataset.placed,'bank'); return;}
  const card=e.target.closest('[data-card]');
  if(card){const ci=+card.dataset.card;
    if(['letter-build','sentence-order','rank-order'].includes(q.type)){const f=firstEmpty(v); if(f>=0){place(ci,'s'+f);} return;}
    if(q.type==='drag-fill'&&picked==null){const f=q.answer.findIndex((_,k)=>v[k]==null); /* bấm thẻ khi chưa chọn ô → chọn thẻ */}
    picked=(picked===ci?null:ci); renderQuestion(); announce(picked!=null?'Đã chọn thẻ '+card.textContent+'. Bấm vào ô để thả.':'Bỏ chọn thẻ'); return;}
  const drop=e.target.closest('[data-drop]');
  if(drop){const d=drop.dataset.drop;
    if(picked!=null){ if(d.startsWith('r')&&QUIZ_DATA[cur].cards[picked]!=='No mistake')return; place(picked,d); return; }
    if(d[0]==='s'){const k=+d.slice(1); if(q.type!=='drag-fill'&&v[k]!=null){ place(v[k],'bank'); } }
  }
});
/* Ô thả xuống tự dựng: nút + danh sách (thay <select> để căn giữa và giãn dòng được trên mọi trình duyệt) */
let ddMenu=null;
function closeDD(focusBtn){ if(!ddMenu)return; const b=ddMenu._btn; ddMenu.remove(); ddMenu=null; if(b){b.setAttribute('aria-expanded','false'); if(focusBtn)b.focus({preventScroll:true});} }
function setDD(k,id){ const s=S[cur];
  if(k==='') { s.v=id; delete s.marks.dd; } else { s.v[+k]=id; delete s.marks['dd'+k]; }
  change(); renderQuestion(); const nb=app.querySelector('.dd[data-k="'+k+'"]'); if(nb)nb.focus({preventScroll:true}); }
function placeDD(m,btn){ const r=btn.getBoundingClientRect(), w=Math.max(r.width,200); m.style.minWidth=w+'px';
  m.style.left=Math.max(8,Math.min(r.left+r.width/2-m.offsetWidth/2, innerWidth-m.offsetWidth-8))+'px';
  const below=innerHeight-r.bottom-8; m.style.top=(below>=m.offsetHeight||below>=r.top)?(r.bottom+6)+'px':Math.max(8,r.top-6-m.offsetHeight)+'px'; }
function openDD(btn){
  if(ddMenu&&ddMenu._btn===btn){closeDD(true);return;} closeDD();
  const q=QUIZ_DATA[cur], k=btn.dataset.k, val=(k===''?S[cur].v:S[cur].v[+k]);
  const m=document.createElement('div'); m.className='ddmenu'; m.setAttribute('role','listbox'); m._btn=btn;
  m.innerHTML=q.options.map(o=>`<button type="button" class="ddopt ${val===o.id?'on':''}" role="option" aria-selected="${val===o.id}" data-id="${o.id}">${esc(ddText(o))}</button>`).join('');
  document.body.appendChild(m); ddMenu=m; btn.setAttribute('aria-expanded','true');
  placeDD(m,btn);
  m.addEventListener('click',e=>{const o=e.target.closest('.ddopt'); if(!o)return; closeDD(); setDD(k,o.dataset.id);});
  m.addEventListener('keydown',e=>{const all=[...m.querySelectorAll('.ddopt')], j=all.indexOf(document.activeElement);
    if(e.key==='ArrowDown'){e.preventDefault(); all[(j+1)%all.length].focus();}
    else if(e.key==='ArrowUp'){e.preventDefault(); all[(j-1+all.length)%all.length].focus();}
    else if(e.key==='Escape'){e.preventDefault(); closeDD(true);} else if(e.key==='Tab'){closeDD(true);} });
  (m.querySelector('.ddopt.on')||m.querySelector('.ddopt')).focus({preventScroll:true});
}
document.addEventListener('pointerdown',e=>{ if(ddMenu&&!ddMenu.contains(e.target)&&e.target.closest('.dd')!==ddMenu._btn) closeDD(); },true);
const followDD=e=>{ if(!ddMenu)return; if(e&&e.target&&ddMenu.contains(e.target))return; if(!document.body.contains(ddMenu._btn)){closeDD();return;} placeDD(ddMenu,ddMenu._btn); };
window.addEventListener('resize',followDD); window.addEventListener('scroll',followDD,true);
app.addEventListener('keydown',e=>{ const b=e.target.closest('.dd'); if(b&&!b.disabled&&(e.key==='ArrowDown'||e.key==='ArrowUp')){e.preventDefault(); if(!ddMenu)openDD(b);} });
app.addEventListener('input',e=>{ const b=e.target.dataset.box; if(b==null||view!==cur||locked(cur))return;
  S[cur].v[+b]=e.target.value; delete S[cur].marks['b'+b]; e.target.classList.remove('bad'); S[cur].msg='';
  app.querySelectorAll('.boxref[data-ref="'+b+'"]').forEach(x=>{x.textContent=e.target.value||('ô '+(+b+1)); x.classList.toggle('empty',!e.target.value);}); });
app.addEventListener('keydown',e=>{ if(e.key==='Enter'&&e.target.dataset.box!=null&&view===cur&&!locked(cur)){ e.preventDefault(); check(); }});
app.addEventListener('keydown',e=>{ const b=e.target.closest('.box[data-drop]'); if(b&&(e.key==='Enter'||e.key===' ')){e.preventDefault(); b.click();} });
function announce(t){document.getElementById('live').textContent=t;}

/* Kéo – thả bằng chuột và cảm ứng (Pointer Events) */
let drag=null;
app.addEventListener('pointerdown',e=>{
  if(phase!=='quiz'||view!==cur||locked(cur))return; const c=e.target.closest('[data-card],[data-placed],[data-from]'); if(!c||e.button>0)return;
  const fromSlot=c.dataset.from!=null?+c.dataset.drop.slice(1):null;
  drag={ci:+(c.dataset.card??c.dataset.placed??c.dataset.from),el:c,from:fromSlot,x:e.clientX,y:e.clientY,ghost:null,over:null};
});
window.addEventListener('pointermove',e=>{
  if(!drag)return; if(!drag.ghost){ if(Math.hypot(e.clientX-drag.x,e.clientY-drag.y)<8)return;
    if(drag.from!=null){ const g=document.createElement('div'); g.className='card ghost'; g.innerHTML=drag.el.innerHTML; drag.ghost=g; }
    else { drag.ghost=drag.el.cloneNode(true); drag.ghost.classList.add('ghost'); }
    document.body.appendChild(drag.ghost); drag.el.style.opacity='.35'; picked=null; app.querySelectorAll('.card.picked').forEach(x=>x.classList.remove('picked')); }
  e.preventDefault(); drag.ghost.style.left=e.clientX+'px'; drag.ghost.style.top=e.clientY+'px'; if(e.clientY>innerHeight-70)window.scrollBy(0,14); else if(e.clientY<90)window.scrollBy(0,-14);
  const t=document.elementFromPoint(e.clientX,e.clientY); const d=t&&t.closest('[data-drop]');
  if(drag.over&&drag.over!==d)drag.over.classList.remove('drop-hover'); if(d&&d!==drag.el){d.classList.add('drop-hover');} drag.over=(d===drag.el?null:d);
},{passive:false});
window.addEventListener('pointerup',e=>{
  if(!drag)return; const g=drag; drag=null;
  if(!g.ghost)return; g.ghost.remove(); g.el.style.opacity=''; if(g.over)g.over.classList.remove('drop-hover');
  suppressClick=true; setTimeout(()=>suppressClick=false,50);
  const q=QUIZ_DATA[cur];
  if(g.from!=null&&q.type==='drag-fill'){ // kéo thẻ từ một ô đã điền
    const t=document.elementFromPoint(e.clientX,e.clientY), d=t&&t.closest('[data-drop]'), dd=d&&d.dataset.drop;
    if(d===g.el) return;                                   // thả lại đúng chỗ cũ
    if(dd&&dd[0]==='s'){ const k=+dd.slice(1), v=S[cur].v, other=v[k];
      place(g.ci,dd); if(other!=null&&other!==g.ci){ v[g.from]=other; renderQuestion(); } return; } // sang ô khác (đổi chỗ nếu ô đó đã có thẻ)
    place(g.ci,'bank'); return;                             // thả vào khay hoặc ra ngoài → trả thẻ về
  }
  if(g.over){ const d=g.over.dataset.drop;
    if(d.startsWith('r')&&q.type==='error-fix-grid'&&q.cards[g.ci]!=='No mistake') return;
    place(g.ci,d); }
});
let suppressClick=false; app.addEventListener('click',e=>{ if(suppressClick){e.stopImmediatePropagation();e.preventDefault();} },true);

/* ================= KIỂM TRA ================= */
let justChecked=false;
function check(){
  const q=QUIZ_DATA[cur],s=S[cur],m=missing(q,s.v);
  if(m){s.msg=m; renderQuestion(); return;}
  s.msg=''; s.att++; picked=null;
  if(isCorrect(q,s.v)){ s.status=s.att===1?'ok1':'ok2'; sfx('sfxOk'); announce('Chính xác'); }
  else if(s.att>=2){ s.status='fail'; sfx('sfxBad'); announce('Chưa đúng. Câu đã khoá.'); }
  else { sfx('sfxBad'); markWrong(q,s); announce('Chưa đúng. Xem gợi ý và thử lại.'); }
  justChecked=true; renderQuestion(); hienPhanHoi(); REPORT.progress();
}
function markWrong(q,s){ // lần 1 sai: chỉ đánh dấu ô chưa đúng, trả thẻ sai về chỗ cũ, không lộ đáp án
  const v=s.v; s.marks={};
  switch(q.type){
    case 'mcq':case 'image-mcq':case 'audio-mcq':case 'audio-click-word':s.marks[v]='bad'; break;
    case 'dropdown':{if(q.lines){const r=cellResults(q,v);r.forEach((ok,k)=>{if(!ok){v[k]=null;s.marks['dd'+k]=1;}});}else s.marks.dd=1; break;}
    case 'number-fill':{const r=cellResults(q,v); r.forEach((ok,k)=>{ if(!ok){ v[k]=''; s.marks['b'+k]=1; } }); break;}
    case 'multi-select':{const wrong=v.filter(x=>!q.answer.includes(x)); wrong.forEach(x=>s.marks[x]='bad'); s.v=v.filter(x=>q.answer.includes(x)); break;}
    case 'drag-categorise':{const r=cellResults(q,v); r.forEach((ok,ci)=>{ if(!ok){delete v[ci]; s.marks['c'+ci]=1;} }); break;}
    case 'drag-fill':{const r=cellResults(q,v); r.forEach((ok,k)=>{ if(!ok){ s.marks['c'+v[k]]=1; delete v[k]; s.marks['s'+k]=1; } }); break;}
    case 'letter-build':case 'sentence-order':case 'rank-order':{const r=cellResults(q,v); r.forEach((ok,k)=>{ if(!ok){ s.marks['c'+v[k]]=1; v[k]=null; s.marks['s'+k]=1; } }); break;}
    case 'truefalse-grid':{const r=cellResults(q,v); r.forEach((ok,k)=>{ if(!ok){ delete v[k]; s.marks['r'+k]=1; } }); break;}
    case 'error-fix-grid':{const r=cellResults(q,v); r.forEach((ok,k)=>{ if(!ok){ if(v[k])s.marks['c'+v[k].c]=1; delete v[k]; s.marks['r'+k]=1; } }); break;}
  }
}
function next(){ stopAudio(); if(cur<N-1){cur++; view=cur; picked=null; renderQuestion(); ganKhung(true);} else showResult(); }

let player=null,playingBtn=null;
function stopAudio(){try{if(player)player.pause(); if(window.speechSynthesis)speechSynthesis.cancel();}catch(e){} if(playingBtn)playingBtn.classList.remove('playing'); playingBtn=null;}
function speak(text,btn){ if(!('speechSynthesis' in window)||!text){btn&&btn.classList.remove('playing');return;}
  const u=new SpeechSynthesisUtterance(text); u.lang='en-GB'; u.rate=.85; const vv=speechSynthesis.getVoices().find(x=>/en-GB/i.test(x.lang)); if(vv)u.voice=vv; u.onend=()=>btn&&btn.classList.remove('playing'); speechSynthesis.speak(u); }
function playFile(file,fallback,btn){ stopAudio(); playingBtn=btn; btn&&btn.classList.add('playing');
  player=new Audio((window.AUDIO_INLINE&&AUDIO_INLINE[file])||file); player.onended=()=>btn&&btn.classList.remove('playing');
  let fell=false; const fb=()=>{if(fell)return;fell=true;speak(fallback,btn);}; player.onerror=fb; const p=player.play(); if(p&&p.catch)p.catch(fb); }
function playMain(){ const q=QUIZ_DATA[view],s=S[view],file=q.assets.audio[0];
  if(q.listen_limit&&view===cur&&!locked(cur)){ if(s.plays>=q.listen_limit)return; s.plays++; renderQuestion(); }

  if(phase!=='quiz')return; const typing=/INPUT|TEXTAREA|SELECT/.test(e.target.tagName);
  if((e.altKey&&(e.key==='ArrowLeft'||e.key==='ArrowRight'))||e.key==='BrowserBack'||e.key==='BrowserForward'||(e.key==='Backspace'&&!typing)||e.key==='F5'||((e.ctrlKey||e.metaKey)&&(e.key==='r'||e.key==='R'))){e.preventDefault();}
});

/* ================= KHỞI ĐỘNG ================= */

/* ================= DẠNG CÂU MỚI CHO TO5 (học từ bộ LSDL9): nối có dây · bảng tích nhiều cột · bấm chọn cụm · thẻ lạc nhóm
   + tia số (drag-categorise có q.moc) · ô thả xuống trong một đoạn (dropdown có q.flow, mỗi ô một danh sách riêng q.line_options)
   + khung tư liệu / bảng số liệu cho mọi dạng. Chỉ THÊM vào engine TO5, không sửa hàm gốc (bọc hàm). ================= */
(function(){
const NEWT=['match-lines','tick-grid','pick-words','odd-one-out'];
const MLC=['#7C5CFC','#FF8A3D','#22B573','#FF5D8F','#2E9BD6','#C08A00'];
let mlPick=null;   // ô trái đang chọn (nối)

const _initV=initV; initV=function(q){ switch(q.type){case 'match-lines':case 'tick-grid':case 'odd-one-out':return {}; case 'pick-words':return [];} return _initV(q); };
const _cell=cellResults; cellResults=function(q,v){ switch(q.type){
  case 'match-lines':return q.left.map((_,k)=>v[k]===q.answer[k]);
  case 'tick-grid':return q.rows.map((r,k)=>v[k]===r.answer);
  case 'pick-words':return q.segs.map((_,k)=>v.includes(k)===q.answer.includes(k));
  case 'odd-one-out':return q.sets.map((st,k)=>v['c'+k]===st.odd&&v['r'+k]===st.reason);
  } return _cell(q,v); };
const _miss=missing; missing=function(q,v){ switch(q.type){
  case 'match-lines':return q.left.every((_,k)=>v[k]!=null)?'':'Em hãy nối hết các ô bên trái nhé.';
  case 'tick-grid':return q.rows.every((_,k)=>v[k]!=null)?'':'Em hãy tích đủ mỗi hàng một ô nhé.';
  case 'pick-words':return v.length?'':'Em hãy bấm chọn ít nhất một ô nhé.';
  case 'odd-one-out':return q.sets.every((_,k)=>v['c'+k]!=null&&v['r'+k]!=null)?'':'Em hãy chọn thẻ lạc và lí do ở mỗi nhóm nhé.';
  } return _miss(q,v); };
const _ans=answerText; answerText=function(q){ switch(q.type){
  case 'match-lines':return q.left.map((l,k)=>l+' → '+q.right[q.answer[k]]).join(' · ');
  case 'tick-grid':return q.rows.map(r=>r.text+': '+q.cols[r.answer]).join(' · ');
  case 'pick-words':return q.answer.map(k=>q.segs[k]).join('; ');
  case 'odd-one-out':return q.sets.map((st,k)=>'Nhóm '+(k+1)+': '+st.cards[st.odd]+' – '+st.reasons[st.reason]).join(' · ');
  case 'sentence-order':if(q.chain)return q.answer.join(' → '); break;
  case 'drag-categorise':if(q.moc)return q.targets.map(t=>t+': '+q.answer[t].join('; ')).join(' · '); break;
  } return _ans(q); };
const _mw=markWrong; markWrong=function(q,s){ if(!NEWT.includes(q.type))return _mw(q,s);
  const v=s.v, r=cellResults(q,v); s.marks={};
  if(q.type==='pick-words'){ s.v=v.filter(k=>q.answer.includes(k)); v.filter(k=>!q.answer.includes(k)).forEach(k=>s.marks['p'+k]=1); return; }
  r.forEach((ok,k)=>{ if(ok)return; if(q.type==='odd-one-out'){delete v['c'+k]; delete v['r'+k];} else delete v[k]; s.marks['r'+k]=1; });
};

/* ---- khung ảnh / tư liệu / bảng dùng chung ---- */
function imgTop(q){ return q.assets.images.length?`<div class="imgrow">`+q.assets.images.map(f=>media(f,'scene'+(WIDE.includes(f)?' wide':''),ALT[f]||'Hình minh hoạ')).join('')+`</div>`:''; }
function extraHTML(q){ let h='';
  if(q.tu_lieu) h+=`<div class="tl-box">${q.tu_lieu_ten?`<b>${esc(q.tu_lieu_ten)}</b>`:''}${esc(q.tu_lieu)}</div>`;
  if(q.bang){const b=q.bang; h+=`<div class="sl-wrap"><table class="sl">${b.tieu_de?`<caption>${esc(b.tieu_de)}</caption>`:''}<tr>${b.cot.map(c=>`<th>${esc(c)}</th>`).join('')}</tr>`+
    b.dong.map(r=>`<tr>${r.map(c=>`<td>${esc(c)}</td>`).join('')}</tr>`).join('')+`</table></div>`;}
  return h; }
function afterStem(h,x){ const k=h.indexOf('<div class="stem">'); if(k<0) return x+h; const e=h.indexOf('</div>',k); return h.slice(0,e+6)+x+h.slice(e+6); }

/* ---- thân câu cho các dạng mới ---- */
function newBody(i){
  const q=QUIZ_DATA[i],s=S[i],v=s.v,lk=locked(i),fin=s.status==='fail',okAll=s.status==='ok1'||s.status==='ok2',res=(fin||okAll)?cellResults(q,v):null;
  let h=imgTop(q)+(q.stem?`<div class="stem">${esc(q.stem)}</div>`:'');
  switch(q.type){
  case 'match-lines':{
    const st=(side,k)=>{ if(side==='L'){ if(okAll)return ' ok'; if(fin)return res[k]?' ok':' bad'; if(s.marks['r'+k])return ' wrong'; return (mlPick&&mlPick.s==='L'&&mlPick.k===k&&!lk)?' sel':(v[k]!=null?' on':''); }
      if(mlPick&&mlPick.s==='R'&&mlPick.k===k&&!lk) return ' sel'; const used=Object.keys(v).some(x=>v[x]===k); return used?' on':''; };
    h+=`<div class="ml" data-ml="${i}"><div class="ml-col">`+q.left.map((t,k)=>`<button class="ml-it L${st('L',k)}" data-act="ml" data-side="L" data-k="${k}" ${lk?'disabled':''}>${esc(t)}<i class="dot"></i></button>`).join('')+
      `</div><div class="ml-col">`+q.right.map((t,k)=>`<button class="ml-it R${st('R',k)}" data-act="ml" data-side="R" data-k="${k}" ${lk?'disabled':''}><i class="dot"></i>${esc(t)}</button>`).join('')+`</div><svg class="ml-svg"></svg></div>`;
    if(fin) h+=`<p class="note">Dây xanh: nối đúng · dây đỏ: nối chưa đúng. Đáp án đúng ở khung bên dưới.</p>`;
    else if(!lk) h+=`<p class="note">Bấm một ô ở bên này rồi bấm ô ở bên kia để nối (bắt đầu từ bên nào cũng được), hoặc kéo dây từ ô này sang ô kia. Bấm vào ô đã nối để gỡ dây và nối lại.</p>`;
    break;}
  case 'tick-grid':{
    h+=`<table class="tf tk"><tr><th></th>${q.cols.map(c=>`<th>${esc(c)}</th>`).join('')}</tr>`+q.rows.map((r,k)=>{
      const b=c=>{let cl=v[k]===c?'sel':''; if(okAll&&v[k]===c)cl='ok'; else if(fin){ if(r.answer===c)cl='ok'; else if(v[k]===c)cl='bad'; }
        return `<button class="tfb ${cl}" data-act="tk" data-k="${k}" data-c="${c}" ${lk?'disabled':''} aria-label="${escA(r.text)} – ${escA(q.cols[c])}" aria-pressed="${v[k]===c}">${v[k]===c||(fin&&r.answer===c)?'✓':''}</button>`;};
      return `<tr class="${s.marks['r'+k]?'wrong':''}"><td>${esc(r.text)}</td>${q.cols.map((_,c)=>`<td class="c">${b(c)}</td>`).join('')}</tr>`;}).join('')+`</table>`;
    break;}
  case 'pick-words':{
    let k=-1; const parts=q.passage.split(/(\u0001\d+\u0002)/);
    h+=`<div class="sent pw">`+parts.map(p=>{const m=p.match(/^\u0001(\d+)\u0002$/); if(!m)return esc(p); const j=+m[1], on=v.includes(j);
      let cl=on?'sel':''; if(okAll&&on)cl='ok'; else if(fin){ if(q.answer.includes(j))cl=on?'ok':'miss'; else if(on)cl='bad'; } else if(s.marks['p'+j])cl='bad';
      return `<button class="cw ${cl}" data-act="pw" data-k="${j}" ${lk?'disabled':''} aria-pressed="${on}">${esc(q.segs[j])}</button>`;}).join('')+`</div>`;
    if(!lk) h+=`<p class="note">Bấm vào các ô phù hợp (bấm lại để bỏ chọn).</p>`;
    break;}
  case 'odd-one-out':{
    h+=q.sets.map((st,k)=>{ const wrongSet=s.marks['r'+k], ok=res?res[k]:null;
      const c=st.cards.map((t,j)=>{let cl=v['c'+k]===j?'picked':''; if(okAll&&v['c'+k]===j)cl='ok'; else if(fin){ if(st.odd===j)cl='ok'; else if(v['c'+k]===j)cl='wrong'; }
        return `<button class="card od-c ${cl}" data-act="od" data-g="${k}" data-c="${j}" ${lk?'disabled':''}>${esc(t)}</button>`;}).join('');
      const r=st.reasons.map((t,j)=>{let cl=v['r'+k]===j?'sel':''; if(okAll&&v['r'+k]===j)cl='ok'; else if(fin){ if(st.reason===j)cl='ok'; else if(v['r'+k]===j)cl='bad'; }
        return `<button class="opt od-r ${cl}" data-act="od" data-g="${k}" data-r="${j}" ${lk?'disabled':''}><span class="key">${v['r'+k]===j||(fin&&st.reason===j)?'✓':j+1}</span><span>${esc(t)}</span></button>`;}).join('');
      return `<div class="od-set ${wrongSet?'wrong':''}"><div class="od-h">Nhóm ${k+1} – bấm thẻ lạc:</div><div class="od-cards">${c}</div><div class="od-h">Vì sao thẻ đó lạc nhóm?</div><div class="opts">${r}</div></div>`;}).join('');
    break;}
  }
  return h;
}
const _body=body; body=function(i){
  const q=QUIZ_DATA[i]; let h=NEWT.includes(q.type)?newBody(i):_body(i);
  if(q.type==='drag-categorise'&&q.moc){ const n=q.moc.length;
    const axis=`<div class="nl-axis" style="--n:${n-1}">`+q.moc.map((m,k)=>`<span class="nl-t" style="left:${k/(n-1)*100}%"></span><span class="nl-m" style="left:${k/(n-1)*100}%">${esc(m)}</span>`).join('')+`</div>`;
    h=h.replace('<div class="boxes">',axis+`<div class="boxes nl" style="--n:${n-1}">`); }
  if(q.type==='dropdown'&&q.flow) h=h.replace('<div class="stem"><span class="ddline">','<div class="stem ddflow"><span class="ddline">');
  h=boDe(q,h);
  if(q.tu_lieu||q.bang) h=extraHTML(q)+h;
  return h; };
/* v5: đề bài hiển thị trong thanh tiêu đề câu (theo mẫu), thân câu chỉ còn phần trả lời */
function deBaiText(q){ return q.type==='number-fill'?q.prompt:q.stem; }
function deBai(q){ const t=deBaiText(q); return t?esc(t).replace(/_{2,}/g,'<span class="gap"></span>'):esc(q.instruction||''); }
function boDe(q,h){ const t=deBaiText(q); if(!t) return h;
  for(const x of [`<div class="stem">${esc(t)}</div>`,`<div class="stem">${esc(t).replace(/_{2,}/,'<span class="gap"></span>')}</div>`]){
    const k=h.indexOf(x); if(k>=0) return h.slice(0,k)+h.slice(k+x.length); }
  return h; }
window.deBai=deBai;   // renderQuestion (ngoài khối này) dùng để dựng thanh tiêu đề

/* ô thả xuống trong đoạn: mỗi ô dùng danh sách lựa chọn riêng */
const _openDD=openDD; openDD=function(btn){ const q=QUIZ_DATA[cur]; if(!q.line_options||btn.dataset.k==='')return _openDD(btn);
  const all=q.options; q.options=q.line_options[+btn.dataset.k]; try{ _openDD(btn); } finally { q.options=all; } };

/* dây nối */
function drawML(){ document.querySelectorAll('.ml[data-ml]').forEach(w=>{ const i=+w.dataset.ml, q=QUIZ_DATA[i], s=S[i]; if(!q||!s)return; const v=s.v, svg=w.querySelector('.ml-svg');
  const box=w.getBoundingClientRect(); svg.setAttribute('width',box.width); svg.setAttribute('height',box.height); svg.innerHTML='';
  const fin=s.status==='fail', okAll=s.status==='ok1'||s.status==='ok2';
  const line=(a,b,col,dash)=>{ const p=a.getBoundingClientRect(), r=b.getBoundingClientRect();
    const l=document.createElementNS('http://www.w3.org/2000/svg','line');
    l.setAttribute('x1',p.left+p.width/2-box.left); l.setAttribute('y1',p.top+p.height/2-box.top); l.setAttribute('x2',r.left+r.width/2-box.left); l.setAttribute('y2',r.top+r.height/2-box.top);
    l.setAttribute('stroke',col); l.setAttribute('stroke-width','4'); l.setAttribute('stroke-linecap','round'); if(dash)l.setAttribute('stroke-dasharray','7 6'); svg.appendChild(l);
    a.style.background=col; a.style.borderColor=col; b.style.background=col; b.style.borderColor=col; };
  const dotL=k=>w.querySelector('.ml-it.L[data-k="'+k+'"] .dot'), dotR=k=>w.querySelector('.ml-it.R[data-k="'+k+'"] .dot');
  Object.keys(v).forEach((k,n)=>{ if(v[k]==null)return; const ok=v[k]===q.answer[+k];
    line(dotL(k),dotR(v[k]), okAll?'#22B573':fin?(ok?'#22B573':'#FF5A6E'):MLC[n%MLC.length]); });
  if(fin) q.left.forEach((_,k)=>{ if(v[k]!==q.answer[k]) line(dotL(k),dotR(q.answer[k]),'#22B573',true); });
}); }
let lastView=-1; const _rq=renderQuestion; renderQuestion=function(){ if(view!==lastView){mlPick=null; lastView=view;} _rq(); requestAnimationFrame(drawML); };
/* === VÁ GĐ2 12/11/2026 === */
/* nối bằng cách kéo dây (chuột / bút); trên điện thoại dùng bấm hai đầu để không chặn cuộn trang */
(function(){ let st=null, tmp=null;
  document.addEventListener('pointerdown',e=>{ if(e.pointerType==='touch'||e.button!==0)return; const it=e.target.closest('.ml-it'); if(!it||it.disabled)return;
    st={it,w:it.closest('.ml'),x:e.clientX,y:e.clientY,moved:false}; },true);
  document.addEventListener('pointermove',e=>{ if(!st)return; if(!st.moved&&Math.hypot(e.clientX-st.x,e.clientY-st.y)<8)return; st.moved=true;
    const svg=st.w.querySelector('.ml-svg'), box=st.w.getBoundingClientRect(), d=st.it.querySelector('.dot').getBoundingClientRect();
    if(!tmp){ tmp=document.createElementNS('http://www.w3.org/2000/svg','line'); tmp.setAttribute('stroke','#7C5CFC'); tmp.setAttribute('stroke-width','4');
      tmp.setAttribute('stroke-dasharray','6 6'); tmp.setAttribute('stroke-linecap','round'); svg.appendChild(tmp); }
    tmp.setAttribute('x1',d.left+d.width/2-box.left); tmp.setAttribute('y1',d.top+d.height/2-box.top);
    tmp.setAttribute('x2',e.clientX-box.left); tmp.setAttribute('y2',e.clientY-box.top); e.preventDefault(); });
  document.addEventListener('pointerup',e=>{ if(!st)return; const s0=st; st=null; if(tmp){tmp.remove(); tmp=null;} if(!s0.moved)return;
    const el=document.elementFromPoint(e.clientX,e.clientY), t=el&&el.closest('.ml-it');
    if(!t||t.closest('.ml')!==s0.w||t.dataset.side===s0.it.dataset.side) return;
    mlPick={s:s0.it.dataset.side,k:+s0.it.dataset.k}; t.click(); });
})();
window.addEventListener('resize',()=>requestAnimationFrame(drawML));

/* bấm cho các dạng mới (engine gốc bỏ qua các data-act này) */
app.addEventListener('click',e=>{
  if(phase!=='quiz'||view!==cur||locked(cur))return; const a=e.target.closest('[data-act]'); if(!a)return;
  const act=a.dataset.act; if(!['ml','tk','pw','od'].includes(act))return;
  const q=QUIZ_DATA[cur], s=S[cur], v=s.v; change();
  if(act==='tk'){ const k=+a.dataset.k, c=+a.dataset.c; v[k]=(v[k]===c?undefined:c); if(v[k]===undefined)delete v[k]; delete s.marks['r'+k]; }
  else if(act==='pw'){ const k=+a.dataset.k, j=v.indexOf(k); j<0?v.push(k):v.splice(j,1); delete s.marks['p'+k]; }
  else if(act==='od'){ const g=+a.dataset.g; if(a.dataset.c!=null){const c=+a.dataset.c; v['c'+g]=(v['c'+g]===c?undefined:c); if(v['c'+g]===undefined)delete v['c'+g];}
    else {const r=+a.dataset.r; v['r'+g]=(v['r'+g]===r?undefined:r); if(v['r'+g]===undefined)delete v['r'+g];} delete s.marks['r'+g]; }
  else if(act==='ml'){ const k=+a.dataset.k, sd=a.dataset.side; /* nối: bắt đầu từ bên nào cũng được */
    const noi=(L,R)=>{ for(const x in v) if(v[x]===R) delete v[x]; v[L]=R; delete s.marks['r'+L]; mlPick=null; };
    if(mlPick&&mlPick.s!==sd){ sd==='L'?noi(k,mlPick.k):noi(mlPick.k,k); }
    else if(sd==='L'&&v[k]!=null){ delete v[k]; delete s.marks['r'+k]; mlPick={s:'L',k}; }
    else if(sd==='R'&&Object.keys(v).some(x=>v[x]===k)){ for(const x in v) if(v[x]===k){ delete v[x]; delete s.marks['r'+x]; } mlPick={s:'R',k}; }
    else mlPick=(mlPick&&mlPick.s===sd&&mlPick.k===k)?null:{s:sd,k}; }
  renderQuestion();
});
})();

/* ================= TIẾNG VIỆT 4: 2 dạng thêm vào engine TO5 (bọc hàm, không sửa hàm gốc) =================
   1) Điền chữ: number-fill có q.chu – chấm theo chữ (chuẩn Unicode, bỏ cách thừa, bỏ dấu chấm cuối), GIỮ hoa/thường.
   2) Tách bộ phận câu (split-gap): mỗi dòng là một câu, bấm vào khe giữa hai tiếng để đặt vạch ngăn. */
(function(){
TYPE_LABEL['split-gap']='Tách bộ phận câu';
const normChu=x=>String(x==null?'':x).normalize('NFC').replace(/[ \s]+/g,' ').replace(/[“”]/g,'"').trim().replace(/[.]+$/,'').trim();
const _cell=cellResults; cellResults=function(q,v){
  if(q.type==='number-fill'&&q.chu) return q.answer.map((a,i)=>{const x=normChu(v[i]); return x!==''&&(x===normChu(a)||((q.alts||[])[i]||[]).some(b=>normChu(b)===x));});
  if(q.type==='split-gap') return q.rows.map((r,k)=>v[k]===r.answer);
  return _cell(q,v); };
const _init=initV; initV=function(q){ if(q.type==='split-gap') return {}; return _init(q); };
const _miss=missing; missing=function(q,v){
  if(q.type==='number-fill'&&q.chu) return v.every(x=>normChu(x)!=='')?'':'Em hãy viết đủ các ô trống nhé.';
  if(q.type==='split-gap') return q.rows.every((_,k)=>v[k]!=null)?'':'Em hãy đặt vạch ngăn cho mỗi câu nhé.';
  return _miss(q,v); };
const _ans=answerText; answerText=function(q){
  if(q.type==='split-gap') return q.rows.map(r=>r.trai+' | '+r.phai).join(' · ');
  return _ans(q); };
const _mw=markWrong; markWrong=function(q,s){
  if(q.type!=='split-gap') return _mw(q,s);
  const v=s.v, r=cellResults(q,v); s.marks={}; r.forEach((ok,k)=>{ if(!ok){ delete v[k]; s.marks['r'+k]=1; } }); };
const _body=body; body=function(i){
  const q=QUIZ_DATA[i];
  if(q.type==='number-fill'&&q.chu){ return _body(i).replace(/class="numin( dai)? /g,'class="numin chu ').replace('<p class="note">'+NUM_NOTE+'</p>','<p class="note">Em viết đúng chính tả, chú ý chữ viết hoa.</p>'); }
  if(q.type!=='split-gap') return _body(i);
  const s=S[i],v=s.v,lk=locked(i),fin=s.status==='fail',okAll=s.status==='ok1'||s.status==='ok2';
  let h=q.assets.images.length?`<div class="imgrow">`+q.assets.images.map(f=>media(f,'scene',ALT[f]||'Hình minh hoạ')).join('')+`</div>`:'';
  h+=`<div class="sg-key"><span class="sg-l">${esc(q.ten[0])}</span><b>|</b><span class="sg-r">${esc(q.ten[1])}</span></div>`;
  h+=q.rows.map((r,k)=>{ let row='';
    r.words.forEach((w,j)=>{ const side=v[k]==null?'':(j<=v[k]?' L':' R');
      const okSide=(fin||okAll)?(j<=r.answer?' L':' R'):side;
      row+=`<span class="sg-w${okSide}">${esc(w)}</span>`;
      if(j<r.words.length-1){ let cl=v[k]===j?' on':''; if(okAll&&v[k]===j)cl=' ok'; else if(fin){ if(r.answer===j)cl=' ok'; else if(v[k]===j)cl=' bad'; }
        row+=`<button class="sg-gap${cl}" data-act="sg" data-k="${k}" data-g="${j}" ${lk?'disabled':''} aria-label="Đặt vạch ngăn sau tiếng ${escA(w)}" aria-pressed="${v[k]===j}"><i></i></button>`; } });
    return `<div class="sg-row${s.marks['r'+k]?' wrong':''}"><span class="sg-no">${k+1}.</span>${row}</div>`; }).join('');
  if(!lk) h+=`<p class="note">Bấm vào khe giữa hai tiếng để đặt vạch ngăn (bấm lại để bỏ). Phần bên trái tô xanh, phần bên phải tô cam.</p>`;
  return h; };
app.addEventListener('click',e=>{
  if(phase!=='quiz'||view!==cur||locked(cur))return; const a=e.target.closest('[data-act="sg"]'); if(!a)return;
  const s=S[cur], v=s.v, k=+a.dataset.k, g=+a.dataset.g; change();
  if(v[k]===g) delete v[k]; else v[k]=g; delete s.marks['r'+k]; renderQuestion(); });
})();

/* ================= BÁO CÁO KẾT QUẢ: Google Sheet của giáo viên + tải file Excel ================= */
/* GIÁO VIÊN CHỈ CẦN SỬA 1 DÒNG: dán đường link Web App (Apps Script) vào giữa hai dấu nháy.
   Để trống '' thì bài không gửi đi đâu, học sinh vẫn tải được file Excel để nộp. */
const REPORT_URL = 'https://script.google.com/macros/s/AKfycbzkGfV8nFz-M7yA0WH9uH_Itg4mCxb33kjju29XjLLA4FLAV9YZbMKu-l4_3iGkHjm_/exec';
const LESSON_ID = 'NguVan9_CNDe4';

/* ================= HỘP THƯ ĐI (gửi khi nộp, 16/11/2026): giữ kết quả trên máy đến khi file báo cáo trả lời đã nhận ================= */
const HOP_THU=(function(){
  const K='hopthu_ketqua_v1', HAN=90*864e5; let mem={}; const dang={}, lan={}, nhacDo={};
  function doc(){ try{ const v=localStorage.getItem(K); return v?JSON.parse(v):{}; }catch(e){ return mem; } }
  function ghi(o){ mem=o; try{ localStorage.setItem(K,JSON.stringify(o)); }catch(e){} }
  function tt(id,k){ const el=document.getElementById('guiTT'); if(!el||el.dataset.id!==id) return;
    el.className='gui-tt '+k;
    el.textContent={dang:'⏳ Đang gửi kết quả…',cham:'⏳ Mạng chậm hoặc nhiều bạn đang cùng nộp – máy vẫn tự gửi lại kết quả, không cần làm lại bài.',xong:'✓ Đã gửi kết quả.'}[k]; }
  function them(u,id,b){ const o=doc(); o[id]={u,b,t:Date.now()}; ghi(o); tt(id,'dang'); gui(id); }
  function gui(id){ const it=doc()[id]; if(!it||dang[id]) return; dang[id]=1;
    const ac=window.AbortController?new AbortController():null, hen=ac?setTimeout(()=>ac.abort(),90000):0;   /* treo quá 90 giây: bỏ, gửi lại */
    fetch(it.u,{method:'POST',body:it.b,keepalive:it.b.length<60000,signal:ac?ac.signal:undefined})
      .then(r=>r.json()).then(j=>{ clearTimeout(hen); dang[id]=0;
        if(j&&j.ok){ const o=doc(); delete o[id]; ghi(o); lan[id]=0; tt(id,'xong'); if(j.queued) nhac(it.u); }
        else lai(id); })
      .catch(()=>{ clearTimeout(hen); dang[id]=0; lai(id); }); }
  function lai(id){ const n=(lan[id]||0)+1; lan[id]=n; if(n>=2) tt(id,'cham');
    setTimeout(()=>gui(id), Math.min(120000,5000*Math.pow(2,n-1))*(0.7+Math.random()*0.6)); }
  function nhac(u,k){ k=k||0; if(nhacDo[u]&&!k) return; nhacDo[u]=1;   /* nhắc file ghi hàng đợi; còn bài chờ / đang bận thì nhắc tiếp (tối đa 15 lần) */
    const tiep=()=>{ if(k<15) nhac(u,k+1); else nhacDo[u]=0; };
    setTimeout(()=>{ fetch(u,{method:'POST',body:JSON.stringify({nhacHangDoi:1})}).then(r=>r.json())
      .then(j=>{ if(j&&(j.ban||j.con>0)) tiep(); else nhacDo[u]=0; }).catch(tiep); }, (k?30000:60000)+Math.random()*60000); }
  function guiHet(){ const o=doc(), now=Date.now(); let doi=false;
    Object.keys(o).forEach(id=>{ if(!o[id]||!o[id].u||now-(o[id].t||now)>HAN){ delete o[id]; doi=true; } }); if(doi) ghi(o);
    Object.keys(o).forEach(gui); }
  function vang(){ const o=doc(); Object.keys(o).forEach(id=>{ try{ if(navigator.sendBeacon) navigator.sendBeacon(o[id].u,new Blob([o[id].b],{type:'text/plain;charset=utf-8'})); }catch(e){} }); }
  addEventListener('online',guiHet);
  document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible') guiHet(); else vang(); });
  addEventListener('pagehide',vang);
  addEventListener('load',()=>setTimeout(guiHet,1500));
  return {them,guiHet,doc};
})();
const REPORT=(function(){
  let sending=false, pending=false, rec=null, retries=0, attemptId='', finished=false;
  const KEY=()=>{const st=student(); const k=x=>String(x||'').toLowerCase().normalize('NFC').replace(/\s+/g,' ').trim(); return 'bt_'+LESSON_ID+'|'+k(st.name)+'|'+k(st.cls);};
  function store(o){ try{ if(o===null) localStorage.removeItem(KEY()); else localStorage.setItem(KEY(),JSON.stringify(o)); }catch(e){} }
  function load(){ try{ const v=localStorage.getItem(KEY()); return v?JSON.parse(v):null; }catch(e){ return null; } }
  const pad=n=>(n<10?'0':'')+n;
  const fmtDT=d=>`${pad(d.getDate())}/${pad(d.getMonth()+1)}/${d.getFullYear()} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
  const RES={ok1:'Đ',ok2:'Đ2',fail:'S'};
  const RES_LONG={ok1:'Đúng ngay lần 1',ok2:'Đúng ở lần 2',fail:'Sai'};
  function student(){ return {name:(localGet('rp_name')||'').trim(), cls:(localGet('rp_class')||'').trim()}; }
  function localGet(k){ try{return sessionStorage.getItem(k);}catch(e){return window['__'+k]||'';} }
  function localSet(k,v){ try{sessionStorage.setItem(k,v);}catch(e){} window['__'+k]=v; }
  function build(){
    const st=student(), end=new Date(), begin=new Date(t0), secs=finished?usedSec:Math.max(0,Math.round((Date.now()-t0)/1000));
    const pt=S.reduce((a,_,i)=>a+points(i),0), max=QUIZ_DATA.reduce((a,q)=>a+(q.points_first||1),0);
    const nOk=S.filter(x=>x.status==='ok1'||x.status==='ok2').length, nFirst=S.filter(x=>x.status==='ok1').length;
    const parts={}; ['nhan-biet','thong-hieu','van-dung'].forEach(p=>{const idx=QUIZ_DATA.map((q,i)=>q.part===p?i:-1).filter(i=>i>=0);
      parts[PART_NAME[p]]=idx.length?`${idx.filter(i=>points(i)>0).length}/${idx.length}`:'';});
    return { lessonId:LESSON_ID, lesson:document.title, name:st.name, cls:st.cls,
      start:fmtDT(begin), submitted:fmtDT(end), seconds:secs,
      duration:`${Math.floor(secs/60)} phút ${secs%60} giây`,
      attemptId, status:finished?'Đã nộp':'Đang làm', answered:S.filter(x=>x.status).length,
      variants:(typeof PICKS!=='undefined'?PICKS:[]).map(k=>k+1).join('-'),
      score10:Math.round(pt/max*100)/10, points:pt, maxPoints:max, correct:nOk, firstTry:nFirst, total:N, parts,
      answers:S.map(x=>RES[x.status]||'–'),
      detail:QUIZ_DATA.map((q,i)=>({no:q.no, part:PART_NAME[q.part]||'', type:TYPE_LABEL[q.type]||q.type,
        result:RES_LONG[S[i].status]||'Chưa làm', points:points(i), key:mathText(answerText(q))})) };
  }
  /* ---------- gửi về Google Sheet ---------- */
  function send(){ /* === GỬI KHI NỘP 16/11/2026 === */ /* chỉ gửi khi đã nộp; hộp thư đi giữ đến khi file báo cáo nhận */
    if(!REPORT_URL||REPORT_URL.indexOf('http')!==0||!attemptId||!finished) return;
    HOP_THU.them(REPORT_URL, attemptId, JSON.stringify(build()));
  }
  /* lưu tiến độ trên máy để tải lại trang thì làm tiếp, không làm lại từ đầu */
  function save(){ if(!attemptId) return; store({attemptId, picks:PICKS, S, cur, t0, done:finished, usedSec}); }
  function progress(){ save(); send(); }
  /* ---------- tạo file .xlsx ngay trong trình duyệt (không cần thư viện) ---------- */
  const CRC=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0;}return t;})();
  const crc32=b=>{let c=0xFFFFFFFF;for(let i=0;i<b.length;i++)c=CRC[(c^b[i])&255]^(c>>>8);return (c^0xFFFFFFFF)>>>0;};
  function zip(files){ const enc=new TextEncoder(), parts=[], cen=[]; let off=0;
    const u16=v=>[v&255,(v>>>8)&255], u32=v=>[v&255,(v>>>8)&255,(v>>>16)&255,(v>>>24)&255];
    files.forEach(f=>{ const name=enc.encode(f.name), data=enc.encode(f.data), c=crc32(data);
      const common=[...u16(20),...u16(0x0800),...u16(0),...u16(0),...u16(0x21),...u32(c),...u32(data.length),...u32(data.length),...u16(name.length),...u16(0)];
      const loc=new Uint8Array([...u32(0x04034b50),...common]); parts.push(loc,name,data);
      cen.push(new Uint8Array([...u32(0x02014b50),...u16(20),...common,...u16(0),...u16(0),...u16(0),...u32(0),...u32(off)]),name);
      off+=loc.length+name.length+data.length; });
    const cenSize=cen.reduce((a,b)=>a+b.length,0);
    const end=new Uint8Array([...u32(0x06054b50),...u16(0),...u16(0),...u16(files.length),...u16(files.length),...u32(cenSize),...u32(off),...u16(0)]);
    return new Blob([...parts,...cen,end],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}); }
  const x=s=>String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  const col=n=>{let s='';n++;while(n){const m=(n-1)%26;s=String.fromCharCode(65+m)+s;n=Math.floor((n-1)/26);}return s;};
  function sheetXML(rows,widths){ // rows: [[{v,s}]] ; s: 1=đậm tiêu đề, 2=đậm, 3=xuống dòng
    const cols=widths?'<cols>'+widths.map((w,i)=>`<col min="${i+1}" max="${i+1}" width="${w}" customWidth="1"/>`).join('')+'</cols>':'';
    const data=rows.map((r,ri)=>`<row r="${ri+1}">`+r.map((c,ci)=>{ if(c==null)return ''; const o=typeof c==='object'?c:{v:c};
      const ref=col(ci)+(ri+1), st=o.s?` s="${o.s}"`:'';
      return typeof o.v==='number'?`<c r="${ref}"${st}><v>${o.v}</v></c>`:`<c r="${ref}" t="inlineStr"${st}><is><t xml:space="preserve">${x(o.v)}</t></is></c>`;}).join('')+'</row>').join('');
    return `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">${cols}<sheetData>${data}</sheetData></worksheet>`; }
  function xlsx(sheets){ const ns='http://schemas.openxmlformats.org/';
    const files=[
      {name:'[Content_Types].xml',data:`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="${ns}package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>${sheets.map((_,i)=>`<Override PartName="/xl/worksheets/sheet${i+1}.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>`).join('')}</Types>`},
      {name:'_rels/.rels',data:`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="${ns}package/2006/relationships"><Relationship Id="rId1" Type="${ns}officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>`},
      {name:'xl/workbook.xml',data:`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><workbook xmlns="${ns}spreadsheetml/2006/main" xmlns:r="${ns}officeDocument/2006/relationships"><sheets>${sheets.map((s,i)=>`<sheet name="${x(s.name)}" sheetId="${i+1}" r:id="rId${i+1}"/>`).join('')}</sheets></workbook>`},
      {name:'xl/_rels/workbook.xml.rels',data:`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="${ns}package/2006/relationships">${sheets.map((_,i)=>`<Relationship Id="rId${i+1}" Type="${ns}officeDocument/2006/relationships/worksheet" Target="worksheets/sheet${i+1}.xml"/>`).join('')}<Relationship Id="rId${sheets.length+1}" Type="${ns}officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>`},
      {name:'xl/styles.xml',data:`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><styleSheet xmlns="${ns}spreadsheetml/2006/main"><fonts count="2"><font><sz val="11"/><name val="Calibri"/></font><font><b/><sz val="11"/><name val="Calibri"/></font></fonts><fills count="3"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill><fill><patternFill patternType="solid"><fgColor rgb="FFE8E3FF"/></patternFill></fill></fills><borders count="1"><border/></borders><cellStyleXfs count="1"><xf/></cellStyleXfs><cellXfs count="4"><xf/><xf fontId="1" fillId="2" applyFont="1" applyFill="1"/><xf fontId="1" applyFont="1"/><xf applyAlignment="1"><alignment wrapText="1" vertical="top"/></xf></cellXfs></styleSheet>`},
      ...sheets.map((s,i)=>({name:`xl/worksheets/sheet${i+1}.xml`,data:sheetXML(s.rows,s.widths)}))];
    return zip(files); }
  function download(){
    const r=rec||build(), H=v=>({v,s:1}), B=v=>({v,s:2}), W=v=>({v,s:3});
    const tong=[[B('BÁO CÁO KẾT QUẢ BÀI TẬP')],[],
      ['Bài',r.lesson],['Họ và tên',r.name],['Lớp',r.cls],['Bắt đầu',r.start],['Nộp bài',r.submitted],['Thời gian làm',r.duration],[],
      ['Điểm (thang 10)',r.score10],['Số câu đúng',`${r.correct}/${r.total}`],['Đúng ngay lần 1',`${r.firstTry}/${r.total}`],
      ...Object.keys(r.parts).filter(k=>r.parts[k]).map(k=>[k,r.parts[k]])];
    const ct=[[H('Câu'),H('Mức độ'),H('Dạng bài'),H('Kết quả'),H('Điểm'),H('Đáp án đúng')],
      ...r.detail.map(d=>[d.no,d.part,d.type,d.result,d.points,W(d.key)])];
    const blob=xlsx([{name:'Tổng quan',rows:tong,widths:[20,48]},{name:'Chi tiết từng câu',rows:ct,widths:[6,12,26,16,7,60]}]);
    const safe=s=>String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/đ/g,'d').replace(/Đ/g,'D').replace(/[^A-Za-z0-9]+/g,'_').replace(/^_|_$/g,'');
    const fname=`KetQua_${safe(r.lessonId)}_${safe(r.cls)||'Lop'}_${safe(r.name)||'HocSinh'}.xlsx`;
    const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=fname; document.body.appendChild(a); a.click();
    setTimeout(()=>{URL.revokeObjectURL(a.href); a.remove();},1500); return fname; }
  /* ---------- giao diện ---------- */
  function introForm(){ const st=student();
    return `<div class="rp-form"><label>Họ và tên <input id="rpName" autocomplete="name" maxlength="60" placeholder="VD: Nguyễn Minh An" value="${escRaw(st.name)}"></label>
      <label>Lớp <input id="rpClass" maxlength="20" placeholder="VD: 9A" value="${escRaw(st.cls)}"></label>
      <div class="rp-err" id="rpErr"></div></div>`; }
  function guardStart(go){ const n=document.getElementById('rpName'), c=document.getElementById('rpClass');
    const nv=(n.value||'').replace(/\s+/g,' ').trim(), cv=(c.value||'').replace(/\s+/g,' ').trim();
    if(!nv||!cv){ document.getElementById('rpErr').textContent='Em hãy ghi đủ họ tên và lớp trước khi bắt đầu nhé.'; (nv?c:n).focus(); return; }
    localSet('rp_name',nv); localSet('rp_class',cv);
    const old=load();
    if(old&&old.done){ document.getElementById('rpErr').textContent='Em đã nộp đề này rồi. Mỗi bạn chỉ làm bài một lần.'; return; }
    if(old&&old.attemptId){ attemptId=old.attemptId; finished=false; go(old); return; }
    attemptId=Date.now().toString(36)+Math.random().toString(36).slice(2,8); finished=false; go(null); progress(); }
  function onResult(){ finished=true; rec=build();
    const acts=app.querySelectorAll('.actions'), act=acts[acts.length-1];
    if(act){ const b=document.createElement('button'); b.className='btn btn-xls'; b.id='xlsBtn'; b.textContent='Tải kết quả (Excel)'; b.onclick=download; act.insertBefore(b,act.firstChild);
    }
    if(act&&REPORT_URL&&REPORT_URL.indexOf('http')===0){ const g=document.createElement('div'); g.className='gui-tt'; g.id='guiTT'; g.dataset.id=attemptId; act.parentNode.insertBefore(g,act); }
    progress(); }
  function prefill(){ // trong LMS: lấy sẵn tên học sinh
    const ln=SCORM.get('cmi.learner_name','cmi.core.student_name'); if(!ln) return;
    const nm=ln.indexOf(',')>0?ln.split(',').map(s=>s.trim()).reverse().join(' '):ln;
    if(!student().name) localSet('rp_name',nm); const el=document.getElementById('rpName'); if(el&&!el.value) el.value=nm; }
  return {introForm,guardStart,onResult,prefill,download,build,progress};
})();
window.addEventListener('load',()=>{ REPORT.prefill(); });

/* ================= v4.2: GIỮ KHUNG HÌNH Ở NỘI DUNG BÀI ================= */
function _khung(){ const sb=document.querySelector('.statusbar'), hd=document.querySelector('header.topbar'), card=app.querySelector('.qcard');
  return {sb, sbH:(sb?sb.offsetHeight:0), hdH:(hd?hd.offsetHeight:0), card}; }
function _dichKhung(){ const k=_khung(); let top=k.hdH;                    // thanh tiến trình nằm ngay dưới tên bài
  if(window.matchMedia('(max-width:760px)').matches && k.card) top=k.card.getBoundingClientRect().top+window.scrollY-k.sbH-8;
  return Math.max(0,Math.round(top)); }
function ganKhung(smooth){ if(phase!=='quiz') return;
  const t=_dichKhung(); window.scrollTo({top:t, behavior:smooth?'smooth':'auto'});
  setTimeout(()=>{ if(phase!=='quiz') return; const t2=_dichKhung(); if(Math.abs(t2-t)>4) window.scrollTo({top:t2, behavior:'auto'}); }, 420); }
/* số có nhiều chữ số (2 000 000) không bị ngắt xuống dòng giữa các nhóm: đổi dấu cách thành dấu cách không ngắt khi hiển thị */
function giuSo(root){ const w=document.createTreeWalker(root, NodeFilter.SHOW_TEXT); let n;
  while((n=w.nextNode())){ const t=n.nodeValue; if(/\d \d{3}/.test(t)) n.nodeValue=t.replace(/(\d) (?=\d{3}(?!\d))/g,'$1\u00A0'); } }
new MutationObserver(()=>giuSo(app)).observe(app,{childList:true, subtree:true});
function hienPhanHoi(){ if(phase!=='quiz') return;
  setTimeout(()=>{ const k=_khung(); if(!k.card) return; const r=k.card.getBoundingClientRect();
    const want=r.bottom-window.innerHeight+16; if(want<=0) return;
    const fb=k.card.querySelector('.fb'); const lim=(fb?fb.getBoundingClientRect().top:r.top)-k.sbH-10;
    const d=Math.min(want, lim); if(d>0) window.scrollBy({top:d, behavior:'smooth'}); }, 60); }
renderIntro();
